<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='auth.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>💸 Finance Tracker</h1>

        <h2>Welcome Back</h2>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don’t have an account?
            <a href="/signup">Signup</a>
        </p>

    </div>

</div>

</body>
</html>
